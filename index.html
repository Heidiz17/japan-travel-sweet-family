<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本旅行神隊友</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="日本神隊友">
  <meta name="application-name" content="日本神隊友">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      background: #f8fafc;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 0;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #e11d48;
      letter-spacing: 1px;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      font-weight: bold;
      min-height: 22px;
    }

    #display-box {
      flex: 1;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .text-original { font-size: 16px; color: #64748b; word-break: break-all; }
    .text-main { font-size: 26px; font-weight: bold; color: #dc2626; line-height: 1.35; }
    .text-sub { font-size: 18px; color: #d97706; line-height: 1.35; }

    .replay-btn {
      margin-top: 8px;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .replay-btn:active { background: #475569; }

    /* 文字 / 鍵盤聽寫備用區 */
    .input-fallback {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 16px;
      border: 1.5px solid #cbd5e1;
    }
    .input-fallback input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 10px;
      background: transparent;
      user-select: auto;
      -webkit-user-select: auto;
    }
    .input-fallback button {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 4px;
    }
    .action-btn {
      width: 100%;
      height: 95px;
      border: none;
      border-radius: 20px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      touch-action: manipulation;
    }
    .action-btn:active { transform: scale(0.98); }

    .btn-master {
      background: linear-gradient(135deg, #16a34a, #15803d);
      font-size: 22px;
      font-weight: 900;
    }
    .btn-worker {
      background: linear-gradient(135deg, #e11d48, #be123c);
      font-size: 22px;
      font-weight: 900;
    }
    .btn-subtext { font-size: 13px; font-weight: normal; margin-top: 4px; opacity: 0.9; }
  </style>
</head>
<body>

  <div class="app-header">
    <span style="font-size: 24px;">⛩️🐱🇯🇵</span>
    <span class="app-title">日本神隊友</span>
  </div>

  <div id="status">準備就緒，點掣開始對話</div>

  <div id="display-box">
    <div style="font-size: 46px;">⛩️</div>
    <div style="font-size: 20px; font-weight: bold; color: #0f172a;">明仔芝女日本旅行神器</div>
    <div style="font-size: 14px; color: #16a34a; margin-top: 4px; font-weight: 600;">🟢 我講廣東話 ➔ 自動翻譯日文</div>
    <div style="font-size: 14px; color: #e11d48; margin-top: 4px; font-weight: 600;">🔴 日本人講日語 ➔ 自動翻譯廣東話</div>
  </div>

  <!-- 備用手動/鍵盤語音聽寫框 -->
  <div class="input-fallback">
    <input type="text" id="manual-text" placeholder="鍵盤聽寫 / 打廣東話..." enterkeyhint="go">
    <button onclick="handleManualSubmit()">🚀 翻譯</button>
  </div>

  <div class="btn-container">
    <button class="action-btn btn-master" id="btn-master" onclick="handleMaster()">
      🟢 師傅講嘢 (香港廣東話)
      <span class="btn-subtext">強制鎖死 zh-HK ➔ 翻譯日文</span>
    </button>

    <button class="action-btn btn-worker" id="btn-worker" onclick="handleJapanese()">
      🔴 日本人講嘢 (相手が話す)
      <span class="btn-subtext">日本語 ➔ 翻譯廣東話</span>
    </button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const WORKER_URL = "https://tight-snowflake-4d1fjapan-translator.stream-hub-th.workers.dev";

    const statusDiv = document.getElementById('status');
    const displayBox = document.getElementById('display-box');
    const manualInput = document.getElementById('manual-text');

    manualInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') handleManualSubmit();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let currentRecognizer = null;

    let availableVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function unlockIOSAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const silent = new SpeechSynthesisUtterance(' ');
        silent.volume = 0.01;
        silent.rate = 10;
        window.speechSynthesis.speak(silent);
      }
    }

    function speak(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      utter.volume = 1.0;

      if (availableVoices.length === 0) {
        availableVoices = window.speechSynthesis.getVoices();
      }

      let matchedVoice = null;
      if (lang === 'zh-HK') {
        matchedVoice = availableVoices.find(v => 
          v.lang.toLowerCase() === 'zh-hk' || 
          v.lang.toLowerCase() === 'yue-hant-hk' ||
          v.name.includes('Hong Kong') ||
          v.name.includes('Sin-Ji') ||
          v.name.includes('Cantonese')
        );
      } else if (lang === 'ja-JP') {
        matchedVoice = availableVoices.find(v => 
          v.lang.toLowerCase() === 'ja-jp' || 
          v.name.includes('Japanese') ||
          v.name.includes('Kyoko')
        );
      }

      if (matchedVoice) utter.voice = matchedVoice;

      setTimeout(() => {
        window.speechSynthesis.speak(utter);
      }, 50);
    }

    async function callWorker(payload) {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (e) {
        statusDiv.innerText = "連線失敗: " + e.message;
        return null;
      }
    }

    function createRecognizer(targetLang) {
      if (!SpeechRecognition) return null;

      if (currentRecognizer) {
        try { currentRecognizer.abort(); } catch(e){}
      }

      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.lang = targetLang;
      return rec;
    }

    // 手動/鍵盤聽寫送出
    async function handleManualSubmit() {
      const text = manualInput.value.trim();
      if (!text) return;
      unlockIOSAudio();
      manualInput.value = '';
      manualInput.blur();

      statusDiv.innerText = "⏳ 翻譯緊日文...";
      displayBox.innerHTML = '<div class="text-original">師傅講：「' + text + '」</div><div style="color: #ca8a04; margin-top: 10px; font-weight: bold;">⏳ 正在呼叫 AI 翻譯...</div>';

      const result = await callWorker({ text: text, mode: "canto_to_ja" });
      renderJaResult(text, result);
    }

    function renderJaResult(spoken, result) {
      if (result && result.ja) {
        const safeJa = encodeURIComponent(result.ja);
        displayBox.innerHTML = 
          '<div class="text-original">師傅講：「' + spoken + '」</div>' +
          '<div class="text-main">🇯🇵 ' + result.ja + '</div>' +
          '<div class="text-sub">🗣️ ' + (result.romaji || '') + '</div>' +
          '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeJa + '\'), \'ja-JP\')">🔊 重播日文</button>';
        statusDiv.innerText = "🔊 正在朗讀日文...";
        speak(result.ja, 'ja-JP');
      } else {
        statusDiv.innerText = "出錯: " + (result?.error || "未收到翻譯");
      }
    }

    // 1. 廣東話 ➔ 日文
    function handleMaster() {
      unlockIOSAudio();

      if (!SpeechRecognition) {
        alert("瀏覽器未支援語音辨識，請使用輸入框打字/聽寫！");
        return;
      }

      currentRecognizer = createRecognizer('zh-HK');
      statusDiv.innerText = "🎧 師傅請講廣東話 (已鎖死 zh-HK)...";

      currentRecognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 翻譯緊日文...";
        displayBox.innerHTML = '<div class="text-original">師傅講：「' + spoken + '」</div><div style="color: #ca8a04; margin-top: 10px; font-weight: bold;">⏳ 正在呼叫 AI 翻譯...</div>';

        const result = await callWorker({ text: spoken, mode: "canto_to_ja" });
        renderJaResult(spoken, result);
      };

      currentRecognizer.onerror = (e) => { 
        statusDiv.innerText = "語音識別未收到，可用上方輸入框！"; 
      };

      try {
        currentRecognizer.start();
      } catch (err) {
        setTimeout(() => currentRecognizer.start(), 200);
      }
    }

    // 2. 日語 ➔ 廣東話
    function handleJapanese() {
      unlockIOSAudio();

      if (!SpeechRecognition) {
        alert("音声認識がサポートされていません。");
        return;
      }

      currentRecognizer = createRecognizer('ja-JP');
      statusDiv.innerText = "🎧 日本語でお話しください...";

      currentRecognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 翻譯緊廣東話...";
        displayBox.innerHTML = '<div class="text-original">相手：「' + spoken + '」</div><div style="color: #ca8a04; margin-top: 10px; font-weight: bold;">⏳ 正在呼叫 AI 翻譯...</div>';

        const result = await callWorker({ text: spoken, mode: "ja_to_canto" });

        if (result && result.canto) {
          const safeCanto = encodeURIComponent(result.canto);
          displayBox.innerHTML = 
            '<div class="text-original">日本語：「' + spoken + '」</div>' +
            '<div class="text-main" style="color: #16a34a;">廣東話：' + result.canto + '</div>' +
            '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeCanto + '\'), \'zh-HK\')">🔊 重播廣東話</button>';
          statusDiv.innerText = "🔊 正在朗讀廣東話...";
          speak(result.canto, 'zh-HK');
        } else {
          statusDiv.innerText = "出錯: " + (result?.error || "未收到翻譯");
        }
      };

      currentRecognizer.onerror = () => { 
        statusDiv.innerText = "聞き取れませんでした，請再試！"; 
      };

      try {
        currentRecognizer.start();
      } catch (err) {
        setTimeout(() => currentRecognizer.start(), 200);
      }
    }
  </script>
</body>
</html>
