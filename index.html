<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本旅行神隊友</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="日本神隊友">
  <meta name="application-name" content="日本神隊友">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 2px 0;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #e11d48;
      letter-spacing: 1px;
    }

    #status {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      font-weight: bold;
      min-height: 20px;
    }

    #display-box {
      flex: 1;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    }
    .text-original { font-size: 16px; color: #64748b; word-break: break-all; }
    .text-main { font-size: 28px; font-weight: bold; color: #dc2626; line-height: 1.35; }
    .text-sub { font-size: 19px; color: #d97706; line-height: 1.35; }

    .replay-btn {
      margin-top: 10px;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 18px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .replay-btn:active { background: #475569; }

    /* 升級版：大號廣東話聽寫／打字輸入框 */
    .canto-input-card {
      background: #ffffff;
      border: 2.5px solid #16a34a;
      border-radius: 22px;
      padding: 8px 8px 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.15);
    }
    .canto-input-card input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      background: transparent;
      user-select: auto;
      -webkit-user-select: auto;
    }
    .canto-input-card input::placeholder {
      color: #94a3b8;
      font-size: 15px;
      font-weight: normal;
    }
    .btn-send {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 12px 20px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
      touch-action: manipulation;
    }
    .btn-send:active { transform: scale(0.96); }

    /* 日本人講話大按鈕 */
    .btn-japanese {
      width: 100%;
      height: 90px;
      border: none;
      border-radius: 22px;
      color: #ffffff;
      background: linear-gradient(135deg, #e11d48, #be123c);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.25);
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-japanese:active { transform: scale(0.97); }
    .btn-title { font-size: 22px; font-weight: 900; }
    .btn-subtext { font-size: 13px; font-weight: normal; margin-top: 4px; opacity: 0.9; }
  </style>
</head>
<body>

  <div class="app-header">
    <span style="font-size: 24px;">⛩️🐱🇯🇵</span>
    <span class="app-title">日本神隊友</span>
  </div>

  <div id="status">準備就緒，點掣開始</div>

  <div id="display-box">
    <div style="font-size: 50px;">⛩️</div>
    <div style="font-size: 21px; font-weight: bold; color: #0f172a;">明仔芝女日本旅行神器</div>
    <div style="font-size: 14px; color: #16a34a; margin-top: 4px; font-weight: 600;">🟢 上方打字／按鍵盤咪高峰講廣東話 ➔ 轉日文</div>
    <div style="font-size: 14px; color: #e11d48; margin-top: 4px; font-weight: 600;">🔴 日本人講日文 ➔ 按下方大紅掣</div>
  </div>

  <!-- 1. 我講嘢：大號綠框（點入去用鍵盤咪高峰講廣東話，100% 準確） -->
  <div class="canto-input-card">
    <input type="text" id="manual-text" placeholder="點此用鍵盤咪講廣東話 / 打字..." enterkeyhint="go">
    <button class="btn-send" onclick="handleManualSubmit()">🚀 翻譯</button>
  </div>

  <!-- 2. 日本人講嘢：保留語音大按鈕 -->
  <button class="btn-japanese" id="btn-worker" onclick="handleJapanese()">
    <span class="btn-title">🔴 日本人講嘢 (相手が話す)</span>
    <span class="btn-subtext">日本語 ➔ 自動翻譯並朗讀廣東話</span>
  </button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const WORKER_URL = "https://tight-snowflake-4d1fjapan-translator.stream-hub-th.workers.dev";

    const statusDiv = document.getElementById('status');
    const displayBox = document.getElementById('display-box');
    const manualInput = document.getElementById('manual-text');

    manualInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') handleManualSubmit();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let currentRecognizer = null;

    let availableVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function unlockIOSAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const silent = new SpeechSynthesisUtterance(' ');
        silent.volume = 0.01;
        silent.rate = 10;
        window.speechSynthesis.speak(silent);
      }
    }

    function speak(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      utter.volume = 1.0;

      if (availableVoices.length === 0) {
        availableVoices = window.speechSynthesis.getVoices();
      }

      let matchedVoice = null;
      if (lang === 'zh-HK') {
        matchedVoice = availableVoices.find(v => 
          v.lang.toLowerCase() === 'zh-hk' || 
          v.lang.toLowerCase() === 'yue-hant-hk' ||
          v.name.includes('Hong Kong') ||
          v.name.includes('Sin-Ji') ||
          v.name.includes('Cantonese')
        );
      } else if (lang === 'ja-JP') {
        matchedVoice = availableVoices.find(v => 
          v.lang.toLowerCase() === 'ja-jp' || 
          v.name.includes('Japanese') ||
          v.name.includes('Kyoko')
        );
      }

      if (matchedVoice) utter.voice = matchedVoice;

      setTimeout(() => {
        window.speechSynthesis.speak(utter);
      }, 50);
    }

    async function callWorker(payload) {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (e) {
        statusDiv.innerText = "連線失敗: " + e.message;
        return null;
      }
    }

    // 師傅講廣東話（鍵盤語音/文字）➔ 日文
    async function handleManualSubmit() {
      const text = manualInput.value.trim();
      if (!text) return;
      unlockIOSAudio();
      manualInput.value = '';
      manualInput.blur();

      statusDiv.innerText = "⏳ 翻譯緊日文...";
      displayBox.innerHTML = '<div class="text-original">我講：「' + text + '」</div><div style="color: #ca8a04; margin-top: 10px; font-weight: bold;">⏳ 正在呼叫 AI 翻譯...</div>';

      const result = await callWorker({ text: text, mode: "canto_to_ja" });

      if (result && result.ja) {
        const safeJa = encodeURIComponent(result.ja);
        displayBox.innerHTML = 
          '<div class="text-original">我講：「' + text + '」</div>' +
          '<div class="text-main">🇯🇵 ' + result.ja + '</div>' +
          '<div class="text-sub">🗣️ ' + (result.romaji || '') + '</div>' +
          '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeJa + '\'), \'ja-JP\')">🔊 重播日文</button>';
        statusDiv.innerText = "🔊 正在朗讀日文...";
        speak(result.ja, 'ja-JP');
      } else {
        statusDiv.innerText = "出錯: " + (result?.error || "未收到翻譯");
      }
    }

    // 日本人講日文 ➔ 廣東話
    function handleJapanese() {
      unlockIOSAudio();

      if (!SpeechRecognition) {
        alert("音声認識がサポートされていません。");
        return;
      }

      if (currentRecognizer) {
        try { currentRecognizer.abort(); } catch(e){}
      }

      currentRecognizer = new SpeechRecognition();
      currentRecognizer.continuous = false;
      currentRecognizer.interimResults = false;
      currentRecognizer.lang = 'ja-JP';

      statusDiv.innerText = "🎧 日本語でお話しください...";

      currentRecognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 翻譯緊廣東話...";
        displayBox.innerHTML = '<div class="text-original">相手：「' + spoken + '」</div><div style="color: #ca8a04; margin-top: 10px; font-weight: bold;">⏳ 正在呼叫 AI 翻譯...</div>';

        const result = await callWorker({ text: spoken, mode: "ja_to_canto" });

        if (result && result.canto) {
          const safeCanto = encodeURIComponent(result.canto);
          displayBox.innerHTML = 
            '<div class="text-original">日本語：「' + spoken + '」</div>' +
            '<div class="text-main" style="color: #16a34a;">廣東話：' + result.canto + '</div>' +
            '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeCanto + '\'), \'zh-HK\')">🔊 重播廣東話</button>';
          statusDiv.innerText = "🔊 正在朗讀廣東話...";
          speak(result.canto, 'zh-HK');
        } else {
          statusDiv.innerText = "出錯: " + (result?.error || "未收到翻譯");
        }
      };

      currentRecognizer.onerror = () => { 
        statusDiv.innerText = "聞き取れませんでした，請再試！"; 
      };

      try {
        currentRecognizer.start();
      } catch (err) {
        setTimeout(() => currentRecognizer.start(), 200);
      }
    }
  </script>
</body>
</html>
