<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本旅行神隊友</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="日本神隊友">
  <meta name="application-name" content="日本神隊友">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      background: #f8fafc;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 0;
    }
    .app-title {
      font-size: 26px;
      font-weight: 900;
      color: #e11d48;
      letter-spacing: 1px;
    }

    #status {
      text-align: center;
      font-size: 15px;
      color: #64748b;
      font-weight: bold;
      min-height: 24px;
    }

    #display-box {
      flex: 1;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .text-original { font-size: 17px; color: #64748b; }
    .text-main { font-size: 28px; font-weight: bold; color: #dc2626; line-height: 1.35; }
    .text-sub { font-size: 20px; color: #d97706; line-height: 1.35; }

    .replay-btn {
      margin-top: 10px;
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .replay-btn:active { background: #475569; }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 8px;
    }
    .action-btn {
      width: 100%;
      height: 110px;
      border: none;
      border-radius: 22px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      touch-action: manipulation;
    }
    .action-btn:active { transform: scale(0.97); }

    .btn-master {
      background: linear-gradient(135deg, #16a34a, #15803d);
      font-size: 24px;
      font-weight: 900;
    }
    .btn-worker {
      background: linear-gradient(135deg, #e11d48, #be123c);
      font-size: 24px;
      font-weight: 900;
    }
    .btn-subtext { font-size: 14px; font-weight: normal; margin-top: 5px; opacity: 0.9; }
  </style>
</head>
<body>

  <div class="app-header">
    <span style="font-size: 24px;">⛩️🐱🇯🇵</span>
    <span class="app-title">日本神隊友</span>
  </div>

  <div id="status">準備就緒，點掣開始對話</div>

  <div id="display-box">
    <div style="font-size: 52px;">⛩️</div>
    <div style="font-size: 22px; font-weight: bold; color: #0f172a;">明仔芝女日本旅行神器</div>
    <div style="font-size: 15px; color: #16a34a; margin-top: 4px; font-weight: 600;">🟢 師傅講廣東話 ➔ 自動讀出日文</div>
    <div style="font-size: 15px; color: #e11d48; margin-top: 4px; font-weight: 600;">🔴 日本人講日語 ➔ 自動讀出廣東話</div>
  </div>

  <div class="btn-container">
    <button class="action-btn btn-master" id="btn-master" onclick="handleMaster()">
      🟢 師傅講嘢 (我講廣東話)
      <span class="btn-subtext">講廣東話 ➔ 自動翻譯並讀出日文</span>
    </button>

    <button class="action-btn btn-worker" id="btn-worker" onclick="handleJapanese()">
      🔴 日本人講嘢 (相手が話す)
      <span class="btn-subtext">日本語 ➔ 自動翻譯並讀出廣東話</span>
    </button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const WORKER_URL = "https://tight-snowflake-4d1fjapan-translator.stream-hub-th.workers.dev";

    const statusDiv = document.getElementById('status');
    const displayBox = document.getElementById('display-box');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;

    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.continuous = false;
      recognizer.interimResults = false;
    }

    // 1. 預先載入系統 Voice 清單（防止 iOS 搵唔到語音包而靜音）
    let availableVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 2. 解鎖 iOS 語音通道（純 TTS 觸發，不鎖死 Session）
    function unlockIOSAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const silent = new SpeechSynthesisUtterance(' ');
        silent.volume = 0.01;
        silent.rate = 10;
        window.speechSynthesis.speak(silent);
      }
    }

    // 3. 專為 iOS 設計的發音核心：嚴格鎖定廣東話 / 日語
    function speak(text, lang) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      utter.volume = 1.0;

      if (availableVoices.length === 0) {
        availableVoices = window.speechSynthesis.getVoices();
      }

      let matchedVoice = null;

      // 如果係廣東話，優先搵香港粵語語音包，杜絕普通話 (zh-CN)
      if (lang === 'zh-HK') {
        matchedVoice = availableVoices.find(v => 
          v.lang.toLowerCase() === 'zh-hk' || 
          v.lang.toLowerCase() === 'yue-hant-hk' ||
          v.name.includes('Hong Kong') ||
          v.name.includes('Sin-Ji') ||
          v.name.includes('Cantonese')
        );
      } else if (lang === 'ja-JP') {
        matchedVoice = availableVoices.find(v => 
          v.lang.toLowerCase() === 'ja-jp' || 
          v.lang.toLowerCase().startsWith('ja') ||
          v.name.includes('Japanese') ||
          v.name.includes('Kyoko') ||
          v.name.includes('Otoya')
        );
      }

      // 次選：一般前綴配對
      if (!matchedVoice) {
        matchedVoice = availableVoices.find(v => 
          v.lang.toLowerCase() === lang.toLowerCase() || 
          v.lang.replace('_', '-').toLowerCase().startsWith(lang.split('-')[0].toLowerCase())
        );
      }

      if (matchedVoice) {
        utter.voice = matchedVoice;
      }

      utter.onstart = () => {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
      };

      setTimeout(() => {
        window.speechSynthesis.speak(utter);
      }, 50);
    }

    async function callWorker(payload) {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (e) {
        statusDiv.innerText = "連線失敗: " + e.message;
        displayBox.innerHTML = '<div style="color: #ef4444; font-weight: bold;">連線出錯，請檢查網絡或 Worker！</div>';
        return null;
      }
    }

    // 1. 廣東話 ➔ 日文
    function handleMaster() {
      unlockIOSAudio();

      if (!recognizer) {
        statusDiv.innerText = "⚠️ 此瀏覽器不支援語音識別";
        alert("此模式尚未支援語音辨識，請使用 Safari / Chrome 並確保授權麥克風！");
        return;
      }

      // 明確寫死香港廣東話辨識
      recognizer.lang = 'zh-HK';
      statusDiv.innerText = "🎧 師傅請講廣東話...";

      try {
        recognizer.start();
      } catch (err) {
        recognizer.stop();
        setTimeout(() => recognizer.start(), 150);
      }

      recognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 翻譯緊日文...";
        displayBox.innerHTML = '<div class="text-original">師傅講：「' + spoken + '」</div><div style="color: #ca8a04; margin-top: 10px; font-weight: bold;">⏳ 正在呼叫 AI 翻譯...</div>';

        const result = await callWorker({ text: spoken, mode: "canto_to_ja" });

        if (result && result.error) {
          statusDiv.innerText = "出錯: " + result.error;
          displayBox.innerHTML += '<div style="color: #ef4444; margin-top: 8px;">後台錯誤: ' + result.error + '</div>';
          return;
        }

        if (result && result.ja) {
          const safeJa = encodeURIComponent(result.ja);
          displayBox.innerHTML = 
            '<div class="text-original">師傅講：「' + spoken + '」</div>' +
            '<div class="text-main">🇯🇵 ' + result.ja + '</div>' +
            '<div class="text-sub">🗣️ ' + (result.romaji || '') + '</div>' +
            '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeJa + '\'), \'ja-JP\')">🔊 重播日文</button>';
          statusDiv.innerText = "🔊 正在朗讀日文...";
          speak(result.ja, 'ja-JP');
        } else {
          statusDiv.innerText = "未收到有效翻譯結果";
        }
      };

      recognizer.onerror = () => { 
        statusDiv.innerText = "語音識別未收到，請再試！"; 
      };
    }

    // 2. 日本人講日語 ➔ 廣東話
    function handleJapanese() {
      unlockIOSAudio();

      if (!recognizer) {
        statusDiv.innerText = "⚠️ 音声認識がサポートされていません";
        alert("音声認識がサポートされていません。");
        return;
      }

      recognizer.lang = 'ja-JP';
      statusDiv.innerText = "🎧 日本語でお話しください...";

      try {
        recognizer.start();
      } catch (err) {
        recognizer.stop();
        setTimeout(() => recognizer.start(), 150);
      }

      recognizer.onresult = async (event) => {
        const spoken = event.results[0][0].transcript;
        statusDiv.innerText = "⏳ 翻譯緊廣東話...";
        displayBox.innerHTML = '<div class="text-original">相手：「' + spoken + '」</div><div style="color: #ca8a04; margin-top: 10px; font-weight: bold;">⏳ 正在呼叫 AI 翻譯...</div>';

        const result = await callWorker({ text: spoken, mode: "ja_to_canto" });

        if (result && result.error) {
          statusDiv.innerText = "出錯: " + result.error;
          displayBox.innerHTML += '<div style="color: #ef4444; margin-top: 8px;">後台錯誤: ' + result.error + '</div>';
          return;
        }

        if (result && result.canto) {
          const safeCanto = encodeURIComponent(result.canto);
          displayBox.innerHTML = 
            '<div class="text-original">日本語：「' + spoken + '」</div>' +
            '<div class="text-main" style="color: #16a34a;">廣東話：' + result.canto + '</div>' +
            '<button class="replay-btn" onclick="speak(decodeURIComponent(\'' + safeCanto + '\'), \'zh-HK\')">🔊 重播廣東話</button>';
          statusDiv.innerText = "🔊 正在朗讀廣東話...";
          speak(result.canto, 'zh-HK');
        } else {
          statusDiv.innerText = "未收到有效翻譯結果";
        }
      };

      recognizer.onerror = () => { 
        statusDiv.innerText = "聞き取れませんでした，請再試！"; 
      };
    }
  </script>
</body>
</html>
